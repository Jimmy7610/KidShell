name: Build and test

# KidShell is a packaged WinUI 3 app, so the build needs a Windows runner.
# This workflow restores, builds and tests. It deliberately does NOT sign,
# publish, deploy or touch anything outside the runner.

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (x64)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Matches the TargetFramework in the project files.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KidShell.sln

      - name: Build
        run: dotnet build KidShell.sln -p:Platform=x64 --configuration Release --no-restore

      - name: Test
        # KidShell.Core targets plain net10.0 and its tests touch no machine
        # state, so they run anywhere. The security tests in particular assert
        # that nothing can change Windows - they must never need a real one.
        run: dotnet test KidShell.sln --configuration Release --no-build --verbosity normal

      - name: Verify no mutation path was introduced
        shell: pwsh
        run: |
          # A cheap second line of defence behind the reflection tests: fail
          # the build if source gains an obvious machine-changing call. The
          # tests are authoritative; this catches a new file nobody tested.
          #
          # Enumerate the files explicitly. This used to pass 'src\**\*.cs' to
          # Select-String -Path, which does NOT recurse - PowerShell's '**' is
          # a literal two-character wildcard matching within a single path
          # segment, so it only ever looked one directory deep and quietly
          # matched nothing. A scan that finds nothing looks exactly like a
          # scan that passes, which is the worst way for a guard to fail.
          $files = @(
            Get-ChildItem -Path 'src' -Recurse -Filter '*.cs' -File |
              Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          )

          # So: assert the enumeration actually found source. If this guard
          # ever silently stops looking again, the build says so.
          if ($files.Count -eq 0) {
            Write-Host '::error::Source scan found no .cs files under src/. The scan is broken, not clean.'
            exit 1
          }

          Write-Host "Scanning $($files.Count) source file(s)."

          # Named APIs whose only purpose is to change the machine. Each maps
          # to something on KidShell's do-not-do list: create or alter accounts,
          # deploy app-control policy, configure kiosk mode, install a service,
          # force autologon, or restart Windows.
          $patterns = @(
            # Local accounts and group membership
            'New-LocalUser',
            'Remove-LocalUser',
            'Set-LocalUser',
            'Add-LocalGroupMember',
            'Remove-LocalGroupMember',
            'NetUserAdd',
            'NetUserDel',
            'NetUserSetInfo',
            'NetLocalGroupAddMembers',
            'NetLocalGroupDelMembers',

            # Application control
            'Set-AppLockerPolicy',
            'ConvertFrom-CIPolicy',
            'CiTool.exe',

            # Kiosk / assigned access
            'Set-AssignedAccess',
            'Clear-AssignedAccess',

            # Services
            'CreateServiceW',
            'ChangeServiceConfig',
            'New-Service',

            # Autologon and shell replacement
            'AutoAdminLogon',
            'DefaultPassword',

            # Ending the session or the machine
            'ExitWindowsEx',
            'InitiateSystemShutdown',
            'Restart-Computer',
            'Stop-Computer'
          )

          # Comments are not calls. KidShell's source documents these APIs at
          # length precisely to say it does not use them - flagging that prose
          # would make the guard useless noise that somebody eventually
          # disables. String literals and real calls are still caught.
          function Test-IsComment([string] $line) {
            $t = $line.Trim()
            return $t.StartsWith('//') -or $t.StartsWith('*') -or $t.StartsWith('/*')
          }

          $hits = @()
          foreach ($p in $patterns) {
            foreach ($match in ($files | Select-String -Pattern $p -SimpleMatch)) {
              if (-not (Test-IsComment $match.Line)) {
                $hits += $match
              }
            }
          }

          if ($hits.Count -gt 0) {
            Write-Host '::error::A machine-changing call appeared in src/.'
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }

          Write-Host "No machine-changing calls found in src/ ($($patterns.Count) patterns checked)."
